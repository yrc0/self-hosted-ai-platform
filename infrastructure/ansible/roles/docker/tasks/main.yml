- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    lock_timeout: 600

- name: Configure Docker log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size }}",
          "max-file": "{{ docker_log_max_files }}"
        }
      }
  notify: Restart Docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
    daemon_reload: true

- name: Flush Docker handlers
  ansible.builtin.meta: flush_handlers

- name: Verify Docker engine
  ansible.builtin.command: docker version --format '{{ "{{.Server.Version}}" }}'
  register: docker_version
  changed_when: false

- name: Verify Docker Compose plugin
  ansible.builtin.command: docker compose version
  register: docker_compose_version
  changed_when: false
