- name: Configure Zabbix server
  hosts: mon_zbx_01
  become: true
  roles:
    - linux_baseline
    - docker
    - zabbix
    - node_exporter

- name: Configure Prometheus and Grafana
  hosts: mon_metrics_01
  become: true
  roles:
    - linux_baseline
    - docker
    - prometheus_grafana
    - node_exporter
    - zabbix_agent
